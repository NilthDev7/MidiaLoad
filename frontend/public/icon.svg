      <stop offset="0%" style="stop-color:#F5E6C4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C5A059;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A6D2B;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" ry="22" fill="#0C1410"/>
  <rect width="94" height="94" x="3" y="3" rx="19" ry="19" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4"/>
