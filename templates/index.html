<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MidiaLoad</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page">
        <section class="shell">
            <header class="hero">
                <p class="eyebrow">YouTube downloader</p>
                <h1>MidiaLoad</h1>
                <p>Baixe áudio ou vídeo direto pelo navegador, sem painel complicado.</p>
            </header>

            <form class="search" action="/info" method="post">
                <label for="url">Link do YouTube</label>
                <div class="search-row">
                    <input
                        id="url"
                        name="url"
                        type="url"
                        value="{{ video.url if video else url or '' }}"
                        placeholder="https://www.youtube.com/watch?v=..."
                        required
                    >
                    <button type="submit">Analisar</button>
                </div>
            </form>

            {% if error %}
                <div class="alert">{{ error }}</div>
            {% endif %}

            {% if video %}
                <section class="preview">
                    {% if video.thumbnail %}
                        <img src="{{ video.thumbnail }}" alt="Thumbnail do vídeo">
                    {% endif %}

                    <div class="preview-info">
                        <h2>{{ video.title }}</h2>
                        <p>Duração: {{ video.duration }}</p>
                    </div>

                    <div class="actions">
                        <form action="/download" method="post">
                            <input type="hidden" name="url" value="{{ video.url }}">
                            <input type="hidden" name="type" value="audio">
                            <button class="audio" type="submit">Baixar áudio</button>
                        </form>

                        <form action="/download" method="post">
                            <input type="hidden" name="url" value="{{ video.url }}">
                            <input type="hidden" name="type" value="video">
                            <button class="video" type="submit">Baixar vídeo</button>
                        </form>
                    </div>
                </section>
            {% endif %}
        </section>
    </main>
</body>
</html>
